# Build the Linux and Windows program files, and publish them as a GitHub release.
#
# Runs when a version tag is pushed:
#
#     git tag -a v1.02 -m "pyraceresults 1.02"
#     git push origin v1.02
#
# The tests run on both systems first; if they fail, nothing is published. The release (named
# after the tag) gets two files: pyraceresults-<version>-linux and pyraceresults-<version>-windows.exe.
#
# It can also be started by hand (Actions > Build and release > Run workflow) to check that the
# builds work: then the files are kept with the run (under Artifacts) and nothing is published.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # An older Ubuntu, so the Linux file runs on older Linux systems as well as newer ones.
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          ./build_linux.sh
          dist/pyraceresults --version
          mv dist/pyraceresults "dist/pyraceresults-${GITHUB_REF_NAME#v}-linux"

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: cmd
        env:
          PYTHON: python
        run: |
          call build_windows.bat || exit /b 1
          set VERSION=%GITHUB_REF_NAME:v=%
          move dist\pyraceresults.exe "dist\pyraceresults-%VERSION%-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: pyraceresults-${{ matrix.name }}
          path: dist/pyraceresults-*
          if-no-files-found: error

  release:
    # Only for a version tag, not when started by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pyraceresults ${GITHUB_REF_NAME#v}" \
            --notes "Download the file for your computer: **-linux** for Linux, **-windows.exe** for Windows. Your competitions and club sailors stay in the .pyraceresults folder in your home folder and are not touched by a new version."
